<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivers Ed Master Study Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 276px;
            --primary: #17191d;
            --primary-hover: #363a40;
            --bg-main: #f7f8fa;
            --card-bg: #ffffff;
            --border: #e7e9ed;
            --text-dark: #17191d;
            --text-muted: #737983;
            --accent-bg: #f1f3f5;
            --highlight-blue: #d6e9ff;
            --highlight-green: #dffcc6;
            --highlight-purple: #e0daff;
            --highlight-teal: #c8f3e8;
            --highlight-yellow: #fff0b8;
            --highlight-red: #ffe0dc;
            --highlight-lavender: #efdfff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        button, input, textarea {
            font: inherit;
        }

        /* SIDEBAR STYLING */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-header h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Search Input */
        .search-box input {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
            background: var(--card-bg);
            color: var(--text-dark);
        }

        .search-box input:focus {
            border-color: #aeb4bd;
        }

        /* Quizlet Quick Links */
        .quick-links {
            background: transparent;
            border: 0;
            border-radius: 0;
            padding: 0;
        }

        .quick-links h3 {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .quizlet-btn {
            display: block;
            text-align: center;
            padding: 7px 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background-color 0.15s;
        }

        .quizlet-btn:hover {
            background: var(--accent-bg);
            color: var(--text-dark);
            border-color: var(--border);
        }

        /* Tab Control for Adding Content */
        .tab-container {
            border: 1px solid var(--border);
            border-radius: 5px;
            overflow: hidden;
            background: var(--card-bg);
        }

        .tab-buttons {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: #f6f7f8;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            border-bottom: 1px solid var(--primary);
        }

        .tab-content {
            padding: 12px;
        }

        /* File Upload Area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--accent-bg);
        }

        .upload-area p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        #fileInput { display: none; }

        /* Paste Box */
        #pasteInput {
            width: 100%;
            height: 80px;
            padding: 8px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            resize: vertical;
            outline: none;
            margin-bottom: 8px;
            background: var(--card-bg);
            color: var(--text-dark);
        }

        .btn-action {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 9px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-action:hover {
            background: var(--primary-hover);
        }

        /* Navigation List */
        .nav-section h3 {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .module-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .module-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 8px;
            border-radius: 4px;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .module-list a:hover {
            background: var(--accent-bg);
            color: var(--primary);
        }

        .badge-count {
            background: var(--accent-bg);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 12px;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 44px clamp(28px, 5vw, 72px);
            max-width: 1440px;
        }

        /* Top Banner Stats */
        .top-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            padding: 0 0 20px;
            margin-bottom: 28px;
        }

        .stat-group {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-item .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .stat-item .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.04em;
        }

        .page-description {
            margin-top: 6px;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .empty-state {
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Module Card & Tables */
        .module-card {
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            padding: 0 0 28px;
            margin-bottom: 36px;
        }

        .module-card h2 {
            font-size: 1rem;
            color: var(--text-dark);
            margin-bottom: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .study-list {
            list-style: none;
            counter-reset: study-item;
        }

        .study-list li {
            counter-increment: study-item;
            position: relative;
            padding: 14px 8px 14px 38px;
            border-bottom: 1px solid var(--border);
            line-height: 1.6;
        }

        .study-list li::before {
            content: counter(study-item, decimal-leading-zero);
            position: absolute;
            left: 8px;
            top: 16px;
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 500;
        }

        .study-question {
            display: block;
            font-weight: 500;
            white-space: pre-line;
        }

        .study-answer {
            display: block;
            margin-top: 4px;
            padding-left: 12px;
            border-left: 1px solid var(--border);
            color: #555b63;
        }

        .study-list li:nth-child(even) { background: transparent; }

        mark {
            background: var(--highlight-blue);
            color: #0b3266;
            font-weight: 600;
            padding: 1px 3px;
            border-radius: 2px;
        }

        mark.highlight-tone-1 { background: var(--highlight-green); color: #256400; }
        mark.highlight-tone-2 { background: var(--highlight-purple); color: #503f91; }
        mark.highlight-rule { background: var(--highlight-green); color: #256400; }
        mark.highlight-action { background: var(--highlight-blue); color: #0b3266; }
        mark.highlight-term { background: var(--highlight-purple); color: #503f91; }
        mark.highlight-number { background: var(--highlight-yellow); color: #664b00; }
        mark.highlight-warning { background: var(--highlight-red); color: #8a281d; }
        mark.highlight-definition { background: var(--highlight-lavender); color: #503f91; }
        mark.highlight-fact { background: var(--highlight-teal); color: #075c4a; }

        ::selection { background: #d6e9ff; color: #17191d; }

        .model-status {
            min-height: 1rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .model-progress {
            display: block;
            width: 100%;
            height: 2px;
            margin-top: 6px;
            border: 0;
            border-radius: 2px;
            overflow: hidden;
            background: var(--border);
            accent-color: #1c77ff;
        }

        .model-progress::-webkit-progress-bar { background: var(--border); }
        .model-progress::-webkit-progress-value { background: #1c77ff; }
        .model-progress::-moz-progress-bar { background: #1c77ff; }

        .app-loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            background: var(--bg-main);
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        .app-loader[aria-hidden="true"] {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .app-loader-content {
            display: grid;
            justify-items: center;
            gap: 12px;
            padding: 24px;
            text-align: center;
        }

        .app-loader-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: #1c77ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .app-loader-title {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .app-loader-detail {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .btn-action[aria-busy="true"] { cursor: progress; }
        .btn-action[aria-busy="true"]::before {
            display: inline-block;
            width: 0.8em;
            height: 0.8em;
            margin-right: 0.65em;
            border: 1px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            content: "";
            vertical-align: -0.08em;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        @media (prefers-reduced-motion: no-preference) {
            .module-card { animation: arrive 0.28s ease-out both; }
            @keyframes arrive {
                from { opacity: 0; transform: translateY(5px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }

        @media (max-width: 760px) {
            body { display: block; }
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }
            .main-content {
                width: 100%;
                margin-left: 0;
                padding: 20px 16px;
            }
            .top-banner {
                align-items: flex-start;
                gap: 16px;
                padding: 16px;
            }
            .stat-group { gap: 16px; }
            .module-card { padding: 18px 14px; }
            .main-content { padding: 28px 18px; }
        }
    </style>
</head>
<body>
    <div class="app-loader" id="appLoader" role="status" aria-live="polite" aria-hidden="false">
        <div class="app-loader-content">
            <span class="app-loader-spinner" aria-hidden="true"></span>
            <p class="app-loader-title">Opening study notes</p>
            <p class="app-loader-detail" id="appLoaderDetail">Preparing the embedded app...</p>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Drivers Ed</h2>
        </div>

        <!-- Search Input -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search cards or related ideas..." oninput="filterSearch()" aria-label="Search cards and related ideas">
        </div>

        <!-- Quizlet Direct Links -->
        <div class="quick-links">
            <h3>Quizlet links</h3>
            <div class="link-grid">
                <a href="https://quizlet.com/126461449/print" target="_blank" rel="noopener noreferrer" class="quizlet-btn">Module 2 ↗</a>
                <a href="https://quizlet.com/126731738/print" target="_blank" rel="noopener noreferrer" class="quizlet-btn">Module 3 ↗</a>
                <a href="https://quizlet.com/126732227/print" target="_blank" rel="noopener noreferrer" class="quizlet-btn">Module 4 ↗</a>
                <a href="https://quizlet.com/126981466/print" target="_blank" rel="noopener noreferrer" class="quizlet-btn">Module 5 ↗</a>
            </div>
        </div>

        <!-- Tabbed Input Panel -->
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('paste', this)">Paste Text</button>
                <button class="tab-btn" onclick="switchTab('upload', this)">Upload .TXT</button>
            </div>

            <!-- Paste Tab -->
            <div id="tabPaste" class="tab-content">
                <textarea id="pasteInput" placeholder="Copy text from Quizlet and paste it here..."></textarea>
                <button class="btn-action" onclick="handlePaste()">Add study set</button>
                <p class="model-status" id="modelStatus" role="status" aria-live="polite"></p>
                <progress class="model-progress hidden" max="100" value="0" aria-label="Local AI loading progress"></progress>
            </div>

            <!-- Upload Tab -->
            <div id="tabUpload" class="tab-content hidden">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <strong>+ Choose .TXT File</strong>
                    <p>Click or drag file here</p>
                    <input type="file" id="fileInput" accept=".txt" multiple onchange="handleFileUpload(event)">
                </div>
                <p class="model-status" id="uploadStatus" role="status" aria-live="polite"></p>
                <progress class="model-progress hidden" max="100" value="0" aria-label="Local AI loading progress"></progress>
            </div>
        </div>

        <!-- Loaded Modules Navigation -->
        <nav class="nav-section">
            <h3>Modules</h3>
            <ul class="module-list" id="moduleNav"></ul>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Dashboard Top Banner -->
        <div class="top-banner">
            <div>
                <h1 class="page-title">Study notes</h1>
                <p class="page-description">Paste or upload a Quizlet set to build study modules</p>
            </div>
            <div class="stat-group">
                <div class="stat-item">
                    <span class="value" id="statModules">0</span>
                    <span class="label">Modules</span>
                </div>
                <div class="stat-item">
                    <span class="value" id="statQuestions">0</span>
                    <span class="label">Questions</span>
                </div>
            </div>
        </div>

        <!-- Modules Container -->
        <div id="modulesContainer"></div>
    </main>

    <script id="embeddedModelParts" type="application/json">__SMOLLM_MODEL_PARTS_JSON__</script>

    <script>
        const moduleStore = [];
        const searchTokenCache = new WeakMap();

        let appDomReady = false;
        function hideStartupLoaderIfReady() {
            if (!appDomReady) return;
            const loader = document.getElementById('appLoader');
            loader.setAttribute('aria-hidden', 'true');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAllModules();
            appDomReady = true;
            hideStartupLoaderIfReady();
        });

        // Tab Switching
        function switchTab(tab, button) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tabPaste').classList.add('hidden');
            document.getElementById('tabUpload').classList.add('hidden');

            if (tab === 'paste') {
                document.getElementById('tabPaste').classList.remove('hidden');
            } else {
                document.getElementById('tabUpload').classList.remove('hidden');
            }
            button.classList.add('active');
        }

        const PARSER_MODEL = 'HuggingFaceTB/SmolLM2-135M-Instruct';
        const PARSER_REVISION = '12fd25f77366fa6b3b4b768ec3050bf629380bac';
        const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
        const ONNX_WASM_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0-dev.20250409-89f8206ba4/dist/';
        let parserPipelinePromise;
        let localModelAssetsPromise;

        function setModelStatus(message) {
            document.querySelectorAll('.model-status').forEach(status => {
                status.textContent = message;
                const progress = status.nextElementSibling;
                if (!(progress instanceof HTMLProgressElement)) return;
                const fraction = message.match(/(\d+)\s+of\s+(\d+)/i);
                const percent = message.match(/(\d+(?:\.\d+)?)%/);
                const indeterminate = /\b(?:loading|starting|interpreting|unpacking|checking)\b/i.test(message);
                if (fraction) {
                    progress.value = Number(fraction[1]) / Number(fraction[2]) * 100;
                    progress.classList.remove('hidden');
                } else if (percent) {
                    progress.value = Number(percent[1]);
                    progress.classList.remove('hidden');
                } else if (indeterminate) {
                    progress.removeAttribute('value');
                    progress.classList.remove('hidden');
                } else {
                    progress.value = 0;
                    progress.classList.add('hidden');
                }
            });
            const loaderDetail = document.getElementById('appLoaderDetail');
            const loader = document.getElementById('appLoader');
            if (loaderDetail && loader?.getAttribute('aria-hidden') === 'false') {
                loaderDetail.textContent = message;
            }
        }

        async function getLocalModelAssets() {
            if (!localModelAssetsPromise) {
                localModelAssetsPromise = (async () => {
                    const partsElement = document.getElementById('embeddedModelParts');
                    const partsText = partsElement?.textContent.trim();
                    if (!partsText || partsText.startsWith('__SMOLLM_')) {
                        throw new Error('Local AI model URLs are not configured. Open the study hub from its published SVG.');
                    }
                    const parts = JSON.parse(partsText);
                    if (!Array.isArray(parts) || parts.length === 0) {
                        throw new Error('The local AI model bundle has no download parts.');
                    }
                    const archiveSize = parts.reduce((total, part) => {
                        if (!Number.isSafeInteger(part.size) || part.size <= 0 ||
                            typeof part.url !== 'string' ||
                            !/^https:\/\/raw\.githubusercontent\.com\/kkudzu\/quizlet\/main\/assets\/model-chunks\/model-\d{3}-[a-f0-9]{64}\.bin$/.test(part.url) ||
                            !/^[a-f0-9]{64}$/.test(part.sha256)) {
                            throw new Error('The local AI model bundle has invalid part metadata.');
                        }
                        const size = total + part.size;
                        if (!Number.isSafeInteger(size)) {
                            throw new Error('The local AI model bundle size is invalid.');
                        }
                        return size;
                    }, 0);
                    const cryptoApi = globalThis.crypto;
                    if (!cryptoApi?.subtle) {
                        throw new Error('This browser cannot verify local AI model downloads. Open the study hub in a modern browser.');
                    }
                    const archive = new Uint8Array(archiveSize);
                    let archiveOffset = 0;
                    for (let index = 0; index < parts.length; index++) {
                        const part = parts[index];
                        setModelStatus(`Downloading local AI model ${index + 1} of ${parts.length}...`);
                        let response;
                        try {
                            response = await fetch(part.url);
                        } catch (error) {
                            throw new Error(`Could not download local AI model part ${index + 1} from GitHub (${error.message}).`);
                        }
                        if (!response.ok) {
                            throw new Error(`Could not download local AI model part ${index + 1} from GitHub (HTTP ${response.status}).`);
                        }
                        const bytes = new Uint8Array(await response.arrayBuffer());
                        if (bytes.length !== part.size) {
                            throw new Error(`Local AI model part ${index + 1} has an unexpected size.`);
                        }
                        const digest = await cryptoApi.subtle.digest('SHA-256', bytes);
                        const actualHash = [...new Uint8Array(digest)]
                            .map(byte => byte.toString(16).padStart(2, '0')).join('');
                        if (actualHash !== part.sha256) {
                            throw new Error(`Local AI model part ${index + 1} failed its integrity check.`);
                        }
                        archive.set(bytes, archiveOffset);
                        archiveOffset += bytes.length;
                        bytes.fill(0);
                    }
                    const assets = await unzipLocalModelArchive(archive);
                    const requiredFiles = [
                        'config.json',
                        'generation_config.json',
                        'merges.txt',
                        'onnx/model_quantized.onnx',
                        'special_tokens_map.json',
                        'tokenizer.json',
                        'tokenizer_config.json',
                        'vocab.json'
                    ];
                    const missingFiles = requiredFiles.filter(file => !assets.has(file));
                    if (missingFiles.length) {
                        throw new Error(`The downloaded local AI archive is missing: ${missingFiles.join(', ')}.`);
                    }
                    return assets;
                })().catch(error => {
                    localModelAssetsPromise = null;
                    throw error;
                });
            }
            return localModelAssetsPromise;
        }

        async function unzipLocalModelArchive(archive) {
            const view = new DataView(archive.buffer, archive.byteOffset, archive.byteLength);
            const endSignature = 0x06054b50;
            const centralSignature = 0x02014b50;
            const localSignature = 0x04034b50;
            let endOffset = -1;
            for (let offset = archive.length - 22; offset >= Math.max(0, archive.length - 65557); offset--) {
                if (view.getUint32(offset, true) === endSignature) {
                    endOffset = offset;
                    break;
                }
            }
            if (endOffset < 0) throw new Error('The downloaded local AI archive is not a valid ZIP file.');

            const entryCount = view.getUint16(endOffset + 10, true);
            let entryOffset = view.getUint32(endOffset + 16, true);
            const decoder = new TextDecoder();
            const assets = new Map();
            const modelRoot = `${PARSER_MODEL}/`;

            for (let index = 0; index < entryCount; index++) {
                if (view.getUint32(entryOffset, true) !== centralSignature) {
                    throw new Error('The downloaded local AI ZIP directory is damaged.');
                }
                const compression = view.getUint16(entryOffset + 10, true);
                const compressedSize = view.getUint32(entryOffset + 20, true);
                const uncompressedSize = view.getUint32(entryOffset + 24, true);
                const filenameLength = view.getUint16(entryOffset + 28, true);
                const extraLength = view.getUint16(entryOffset + 30, true);
                const commentLength = view.getUint16(entryOffset + 32, true);
                const localOffset = view.getUint32(entryOffset + 42, true);
                const filename = decoder.decode(archive.subarray(entryOffset + 46, entryOffset + 46 + filenameLength));
                entryOffset += 46 + filenameLength + extraLength + commentLength;
                if (!filename.startsWith(modelRoot)) continue;

                if (view.getUint32(localOffset, true) !== localSignature) {
                    throw new Error(`The downloaded local AI ZIP entry is damaged: ${filename}.`);
                }
                const localNameLength = view.getUint16(localOffset + 26, true);
                const localExtraLength = view.getUint16(localOffset + 28, true);
                const dataOffset = localOffset + 30 + localNameLength + localExtraLength;
                const compressed = archive.subarray(dataOffset, dataOffset + compressedSize);
                let contents;
                if (compression === 0) {
                    contents = compressed.slice();
                } else if (compression === 8 && typeof DecompressionStream === 'function') {
                    const stream = new Blob([compressed]).stream()
                        .pipeThrough(new DecompressionStream('deflate-raw'));
                    contents = new Uint8Array(await new Response(stream).arrayBuffer());
                } else {
                    throw new Error(`This browser cannot unpack the downloaded local AI file: ${filename}.`);
                }
                if (contents.length !== uncompressedSize) {
                    throw new Error(`The downloaded local AI file is incomplete: ${filename}.`);
                }
                assets.set(filename.slice(modelRoot.length), contents);
                setModelStatus(`Unpacking local AI ${index + 1} of ${entryCount}...`);
            }
            archive.fill(0);
            return assets;
        }

        function createLocalModelCache(assets) {
            function getModelPath(key) {
                const value = typeof key === 'string' ? key : key?.url;
                if (!value) return '';
                const marker = `/${PARSER_MODEL}/resolve/${PARSER_REVISION}/`;
                const markerIndex = value.indexOf(marker);
                return markerIndex === -1 ? '' : value.slice(markerIndex + marker.length).split('?')[0];
            }

            return {
                async match(...keys) {
                    for (const key of keys) {
                        const contents = assets.get(getModelPath(key));
                        if (contents) return new Response(contents);
                    }
                    return undefined;
                },
                async put(key, response) {
                    const path = getModelPath(key);
                    if (!path) throw new Error('Transformers.js requested a model file outside the local bundle.');
                    assets.set(path, new Uint8Array(await response.arrayBuffer()));
                }
            };
        }

        async function getParserPipeline() {
            if (!parserPipelinePromise) {
                parserPipelinePromise = (async () => {
                    const modelAssets = await getLocalModelAssets();
                    let transformers;
                    try {
                        transformers = await import(TRANSFORMERS_URL);
                    } catch (error) {
                        throw new Error(`Could not load Transformers.js from jsDelivr (${error.message}). Check the network or allow cdn.jsdelivr.net.`);
                    }

                    const { env, pipeline } = transformers;
                    env.useBrowserCache = false;
                    env.useFSCache = false;
                    env.useCustomCache = true;
                    env.customCache = createLocalModelCache(modelAssets);
                    env.allowRemoteModels = false;
                    env.allowLocalModels = true;
                    env.remoteHost = 'https://embedded-model.invalid/';
                    env.backends.onnx.wasm.wasmPaths = ONNX_WASM_URL;
                    env.backends.onnx.wasm.numThreads = self.crossOriginIsolated
                        ? Math.max(1, Math.min(4, navigator.hardwareConcurrency || 1))
                        : 1;

                    const progress_callback = progress => {
                        const detail = progress.file || progress.status || 'Preparing model';
                        const percent = Number.isFinite(progress.progress) ? ` ${Math.round(progress.progress)}%` : '';
                        setModelStatus(`Loading local AI ${detail}${percent}`);
                    };
                    setModelStatus('Starting local AI on CPU...');
                    try {
                        return await pipeline('text-generation', PARSER_MODEL, {
                            revision: PARSER_REVISION,
                            device: 'wasm',
                            dtype: 'q8',
                            progress_callback
                        });
                    } catch (error) {
                        throw new Error(`Local AI could not initialize: ${error.message}`);
                    }
                })().catch(error => {
                    parserPipelinePromise = null;
                    throw error;
                });
            }
            return parserPipelinePromise;
        }

        function getQuizletEntries(rawText, fallbackName) {
            const cleanText = rawText.replace(/\d+\s*\/\s*\d+/g, '')
                .replace(/Study online at https:\/\/quizlet\.com\/\S+/g, '')
                .trim();
            const itemRegex = /(?:^|\n)\s*(\d+)[.)]\s*/g;
            const matches = [...cleanText.matchAll(itemRegex)];
            const heading = matches.length
                ? cleanText.slice(0, matches[0].index).trim().split(/\n+/).filter(Boolean).pop() || fallbackName
                : fallbackName;
            const titleMatch = heading.match(/(?:Drivers Ed )?Module \d+/i);
            let title = titleMatch ? titleMatch[0].trim() : heading;
            let entries = matches.map((match, index) => {
                const start = match.index + match[0].length;
                const end = index + 1 < matches.length ? matches[index + 1].index : cleanText.length;
                return { num: Number(match[1]), raw: cleanText.slice(start, end).trim() };
            }).filter(entry => entry.raw);

            if (!entries.length) {
                const body = cleanText;
                const lines = body.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                const blocks = body.split(/\r?\n\s*\r?\n+/).map(block => block.trim()).filter(Boolean);
                if (lines.some(line => line.includes('\t'))) {
                    const hasTitle = lines.length > 1 && !lines[0].includes('\t') &&
                        lines.slice(1).every(line => line.includes('\t'));
                    const rows = hasTitle ? lines.slice(1) : lines;
                    if (hasTitle) title = lines[0];
                    entries = rows.map((line, index) => ({
                        num: index + 1,
                        raw: line.split('\t').map(part => part.trim()).filter(Boolean).join('\n')
                    }));
                } else if (blocks.length > 1) {
                    if (/^(?:drivers ed )?module \d+$/i.test(blocks[0])) {
                        title = blocks.shift();
                    }
                    entries = blocks.map((raw, index) => ({ num: index + 1, raw }));
                } else if (lines.length >= 2) {
                    if (/^(?:drivers ed )?module \d+$/i.test(lines[0])) {
                        title = lines.shift();
                    }
                    entries = [];
                    for (let index = 0; index < lines.length; index += 2) {
                        entries.push({
                            num: entries.length + 1,
                            raw: lines[index + 1] ? `${lines[index]}\n${lines[index + 1]}` : lines[index]
                        });
                    }
                } else if (lines.length) {
                    entries = lines.map((raw, index) => ({ num: index + 1, raw }));
                }
            }

            if (!entries.length) {
                throw new Error('No cards were found. Paste numbered cards, tab-separated Quizlet export, or one card per blank-separated block.');
            }
            return { title, entries };
        }

        function getHighlightPhrases(source, answer) {
            const phrase = answer.trim();
            return phrase && phraseOccursInAnswer(source, phrase) ? [phrase] : [];
        }

        function cardTextForDisplay(source) {
            return source.split(/\n/)
                .filter(line => !/^\s*(?:correct answer|answer key|correct option)\s*[:=-]/i.test(line))
                .map(line => line
                    .replace(/\s+(?:correct answer|answer key|correct option)\s*[:=-]\s*.+$/i, '')
                    .replace(/(^|\s)(?:answer|definition|response|solution)\s*[:=-]\s*/ig, '$1'))
                .join('\n')
                .trim();
        }

        function preserveCard(entry) {
            return {
                num: entry.num,
                question: entry.raw.split(/\n+/).map(line => line.trim()).filter(Boolean).join(' '),
                sourceText: entry.raw,
                answer: '',
                highlights: [],
                kind: 'fact',
                searchTerms: []
            };
        }

        function normalizedSourceText(text) {
            return text.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/\s+/g, ' ');
        }

        function phraseOccursInAnswer(answer, phrase) {
            const normalizedAnswer = normalizedSourceText(answer);
            const normalizedPhrase = normalizedSourceText(phrase);
            return normalizedPhrase && (` ${normalizedAnswer} `).includes(` ${normalizedPhrase} `);
        }

        function extractModelCard(content) {
            const text = String(content || '').replace(/```(?:json)?|```/gi, '');
            const start = text.indexOf('{');
            if (start === -1) return null;
            let depth = 0;
            let inString = false;
            let escaped = false;
            for (let index = start; index < text.length; index++) {
                const character = text[index];
                if (inString) {
                    if (escaped) escaped = false;
                    else if (character === '\\') escaped = true;
                    else if (character === '"') inString = false;
                    continue;
                }
                if (character === '"') inString = true;
                else if (character === '{') depth++;
                else if (character === '}' && --depth === 0) {
                    try {
                        return JSON.parse(text.slice(start, index + 1));
                    } catch {
                        return null;
                    }
                }
            }
            return null;
        }

        function getChoiceOptions(source) {
            return source.split(/\n+/).map(line => {
                const match = line.match(/^\s*(?:\(([A-H])\)|([A-H])[.)])\s+(.+?)\s*$/i);
                return match ? { letter: (match[1] || match[2]).toUpperCase(), text: match[3] } : null;
            }).filter(Boolean);
        }

        function resolveModelAnswer(answer, source) {
            const letter = answer.trim().match(/^(?:option\s*)?([A-H])(?:[.)])?$/i)?.[1]?.toUpperCase();
            const choices = getChoiceOptions(source);
            if (letter) return choices.find(option => option.letter === letter)?.text || answer.trim();
            const normalizedAnswer = normalizedSourceText(answer);
            const matchingChoices = choices.filter(option =>
                phraseOccursInAnswer(option.text, normalizedAnswer)
            );
            return matchingChoices.length === 1 ? matchingChoices[0].text : answer.trim();
        }

        const HIGHLIGHT_KINDS = new Set(['rule', 'action', 'term', 'number', 'warning', 'definition', 'fact']);
        const SEARCH_STOP_WORDS = new Set(['a', 'about', 'an', 'and', 'are', 'can', 'do', 'does', 'for', 'how', 'i', 'in', 'is', 'it', 'me', 'of', 'on', 'or', 'should', 'tell', 'the', 'to', 'what', 'when', 'where', 'which', 'who', 'why', 'with']);

        function validModelCard(entry, item) {
            const preserved = preserveCard(entry);
            if (!item) return preserved;
            const kind = typeof item.kind === 'string' && HIGHLIGHT_KINDS.has(item.kind.toLowerCase())
                ? item.kind.toLowerCase()
                : 'fact';
            const searchTerms = Array.isArray(item.keywords)
                ? [...new Set(item.keywords
                    .filter(keyword => typeof keyword === 'string')
                    .map(keyword => keyword.trim().slice(0, 60))
                    .filter(Boolean))].slice(0, 4)
                : [];
            const answer = typeof item.answer === 'string' ? resolveModelAnswer(item.answer, entry.raw) : '';
            if (!answer || !phraseOccursInAnswer(entry.raw, answer)) {
                return { ...preserved, kind, searchTerms };
            }
            return {
                ...preserved,
                answer,
                highlights: getHighlightPhrases(entry.raw, answer),
                kind,
                searchTerms
            };
        }

        async function parseWithModel(entries) {
            const parser = await getParserPipeline();
            const items = [];
            const errors = [];
            const systemPrompt = 'Parse each driving study card. Return only JSON: {"answer":"exact phrase","kind":"rule|action|term|number|warning|definition|fact","keywords":["related term"]}. Solve it using the card and your knowledge. Copy the full correct choice, not its letter. Add at most two short related search terms. For driver-safety questions, choose the safest legal action. No explanation.';
            const examples = [
                { role: 'user', content: 'Card: What is 2 + 2?\nA. 3\nB. 4\nC. 5' },
                { role: 'assistant', content: '{"answer":"4","kind":"number","keywords":["addition","math"]}' },
                { role: 'user', content: 'Card: Tire pressure should be checked _____.\nweekly' },
                { role: 'assistant', content: '{"answer":"weekly","kind":"rule","keywords":["tire pressure","maintenance"]}' },
                { role: 'user', content: 'Card: On a wet road, what helps maintain a safe following gap?\nA. Increase following distance\nB. Follow closely\nC. Brake hard in turns' },
                { role: 'assistant', content: '{"answer":"Increase following distance","kind":"action","keywords":["rain","safe gap"]}' }
            ];
            for (let index = 0; index < entries.length; index++) {
                const entry = entries[index];
                setModelStatus(`Interpreting card ${index + 1} of ${entries.length}...`);
                const messages = [
                    { role: 'system', content: systemPrompt },
                    ...examples,
                    { role: 'user', content: `Card: ${entry.raw}` }
                ];
                try {
                    const output = await parser(messages, {
                        max_new_tokens: 48,
                        do_sample: false,
                    });
                    const generated = output[0]?.generated_text;
                    const content = typeof generated === 'string'
                        ? generated
                        : Array.isArray(generated)
                            ? generated.at(-1)?.content || ''
                            : '';
                    const parsedItem = extractModelCard(content);
                    items.push(validModelCard(entry, parsedItem) || preserveCard(entry));
                } catch (error) {
                    const message = error instanceof Error ? error.message : String(error);
                    errors.push(`card ${entry.num}: ${message}`);
                    items.push(preserveCard(entry));
                }
            }
            return { items, errors };
        }

        async function parseQuizletText(rawText, fallbackName) {
            const { title, entries } = getQuizletEntries(rawText, fallbackName);
            setModelStatus(`Loading local AI to interpret all ${entries.length} cards...`);
            let parsedItems;
            let modelError = '';
            let cardErrors = [];
            try {
                const result = await parseWithModel(entries);
                parsedItems = result.items;
                cardErrors = result.errors;
            } catch (error) {
                modelError = error instanceof Error ? error.message : String(error);
                parsedItems = entries.map(preserveCard);
            }
            const highlightedCount = parsedItems.filter(item => item.answer).length;
            const unverifiedCount = entries.length - highlightedCount;
            if (modelError) {
                setModelStatus(`AI could not interpret the cards (${modelError}); all ${entries.length} source cards were kept together without highlights.`);
            } else if (cardErrors.length) {
                setModelStatus(`AI could not interpret ${cardErrors.length} card(s) (${cardErrors[0]}); remaining cards were still sent to AI. Highlighted ${highlightedCount} answers and kept ${unverifiedCount} cards unchanged.`);
            } else {
                setModelStatus(unverifiedCount
                    ? `AI interpreted all ${entries.length} cards; highlighted ${highlightedCount} answers and kept ${unverifiedCount} cards unchanged.`
                    : `AI interpreted all ${entries.length} cards and highlighted every answer.`);
            }
            return { title, items: parsedItems };
        }

        async function handlePaste() {
            const input = document.getElementById('pasteInput');
            if (!input.value.trim()) return;
            const button = document.querySelector('#tabPaste .btn-action');
            setButtonBusy(button, true, 'Preparing cards...');
            try {
                const fallback = `Module ${moduleStore.length + 1}`;
                const parsed = await parseQuizletText(input.value, fallback);
                saveModule(parsed);
                input.value = '';
            } catch (error) {
                setModelStatus(error.message || 'Could not parse this Quizlet text.');
            } finally {
                setButtonBusy(button, false);
            }
        }

        function setButtonBusy(button, isBusy, busyLabel = '') {
            if (isBusy) {
                button.dataset.idleLabel ||= button.textContent;
                button.disabled = true;
                button.setAttribute('aria-busy', 'true');
                button.textContent = busyLabel;
            } else {
                button.disabled = false;
                button.removeAttribute('aria-busy');
                if (button.dataset.idleLabel) {
                    button.textContent = button.dataset.idleLabel;
                    delete button.dataset.idleLabel;
                }
            }
        }

        async function handleFileUpload(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;
            try {
                for (const file of files) {
                    setModelStatus(`Reading ${file.name}...`);
                    const text = await file.text();
                    const parsed = await parseQuizletText(text, file.name.replace(/\.txt$/i, ''));
                    saveModule(parsed);
                }
            } catch (error) {
                setModelStatus(error.message || 'Could not parse the selected file.');
            } finally {
                event.target.value = '';
            }
        }

        function saveModule(parsedData) {
            const existingIdx = moduleStore.findIndex(m => m.title.toLowerCase() === parsedData.title.toLowerCase());
            if (existingIdx !== -1) {
                moduleStore[existingIdx] = parsedData;
            } else {
                moduleStore.push(parsedData);
            }
            renderAllModules();
        }

        // Render UI Elements
        function renderAllModules() {
            const container = document.getElementById('modulesContainer');
            const nav = document.getElementById('moduleNav');

            container.innerHTML = '';
            nav.innerHTML = '';

            let totalQuestions = 0;

            if (moduleStore.length === 0) {
                container.innerHTML = '<p class="empty-state">No modules loaded yet. Paste Quizlet text or upload a .TXT file to get started.</p>';
            }

            moduleStore.forEach((mod, index) => {
                const modId = 'module-' + index;
                totalQuestions += mod.items.length;

                // Nav list element
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${modId}"><span>${escapeHtml(mod.title)}</span><span class="badge-count">${mod.items.length}</span></a>`;
                nav.appendChild(li);

                // Card Element
                const card = document.createElement('div');
                card.className = 'module-card';
                card.id = modId;

                const studyItems = mod.items.map(item => {
                    const question = item.question || item.q || item.sentence || '';
                    const answer = item.answer || item.a || '';
                    const sourceText = item.sourceText || question;
                    const searchTerms = Array.isArray(item.searchTerms) ? item.searchTerms.join(' ') : '';
                    const searchableText = normalizedSourceText(`${sourceText} ${answer} ${searchTerms} ${item.kind || ''}`);
                    const displayText = cardTextForDisplay(sourceText);
                    const highlights = answer
                        ? getHighlightPhrases(displayText, answer)
                        : [];
                    const cardHtml = highlightImportantText(displayText, highlights, item.kind);
                    return `<li data-search="${escapeHtml(searchableText)}"><span class="study-question">${cardHtml}</span></li>`;
                }).join('');

                card.innerHTML = `
                    <h2>${escapeHtml(mod.title)}</h2>
                    <ol class="study-list">${studyItems}</ol>
                `;
                container.appendChild(card);
            });

            // Update stats
            document.getElementById('statModules').innerText = moduleStore.length;
            document.getElementById('statQuestions').innerText = totalQuestions;

            filterSearch();
        }

        // Filter Logic
        function filterSearch() {
            const query = normalizedSourceText(document.getElementById('searchInput').value);
            const queryTerms = query ? query.split(' ').filter(term => !SEARCH_STOP_WORDS.has(term)) : [];
            const cards = document.querySelectorAll('.module-card');

            cards.forEach(card => {
                const rows = card.querySelectorAll('.study-list li');
                let matchesInCard = false;

                rows.forEach(row => {
                    const index = row.dataset.search;
                    let indexedTerms = searchTokenCache.get(row);
                    if (!indexedTerms) {
                        indexedTerms = index.split(' ');
                        searchTokenCache.set(row, indexedTerms);
                    }
                    const matchCount = queryTerms.filter(term =>
                        indexedTerms.some(indexedTerm => indexedTerm.startsWith(term))
                    ).length;
                    const requiredMatches = queryTerms.length < 3 ? 1 : Math.ceil(queryTerms.length * 0.6);
                    const matches = !queryTerms.length || index.includes(query) || matchCount >= requiredMatches;
                    if (matches) {
                        row.classList.remove('hidden');
                        matchesInCard = true;
                    } else {
                        row.classList.add('hidden');
                    }
                });

                if (matchesInCard) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function highlightImportantText(text, highlights, kind = 'fact') {
            const phrases = (Array.isArray(highlights) ? highlights : [highlights])
                .filter(phrase => typeof phrase === 'string' && phrase.trim())
                .map(phrase => phrase.trim())
                .sort((left, right) => right.length - left.length);
            if (!phrases.length) return escapeHtml(text);

            const highlightKind = HIGHLIGHT_KINDS.has(kind) ? kind : 'fact';
            const markedPhrases = new Set(phrases.map(normalizedSourceText));
            const alternatives = phrases.map(phrase => phrase
                .split(/[^\p{L}\p{N}]+/u)
                .filter(Boolean)
                .map(word => word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
                .join('[^\\p{L}\\p{N}]+'));
            const pattern = new RegExp(`(?<![\\p{L}\\p{N}])(${alternatives.join('|')})(?![\\p{L}\\p{N}])`, 'giu');
            return text.split(pattern).map(part => {
                if (!markedPhrases.has(normalizedSourceText(part))) return escapeHtml(part);
                return `<mark class="highlight-${highlightKind}">${escapeHtml(part)}</mark>`;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
