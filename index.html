<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivers Ed Master Study Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 276px;
            --primary: #17191d;
            --primary-hover: #363a40;
            --bg-main: #f7f8fa;
            --card-bg: #ffffff;
            --border: #e7e9ed;
            --text-dark: #17191d;
            --text-muted: #737983;
            --accent-bg: #f1f3f5;
            --highlight-blue: #d6e9ff;
            --highlight-green: #dffcc6;
            --highlight-purple: #e0daff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            min-height: 100vh;
        }

        button, input, textarea {
            font: inherit;
        }

        /* SIDEBAR STYLING */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-header h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Search Input */
        .search-box input {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
            background: var(--card-bg);
            color: var(--text-dark);
        }

        .search-box input:focus {
            border-color: #aeb4bd;
        }

        /* Quizlet Quick Links */
        .quick-links {
            background: transparent;
            border: 0;
            border-radius: 0;
            padding: 0;
        }

        .quick-links h3 {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .quizlet-btn {
            display: block;
            text-align: center;
            padding: 7px 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background-color 0.15s;
        }

        .quizlet-btn:hover {
            background: var(--accent-bg);
            color: var(--text-dark);
            border-color: var(--border);
        }

        /* Tab Control for Adding Content */
        .tab-container {
            border: 1px solid var(--border);
            border-radius: 5px;
            overflow: hidden;
            background: var(--card-bg);
        }

        .tab-buttons {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: #f6f7f8;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            border-bottom: 1px solid var(--primary);
        }

        .tab-content {
            padding: 12px;
        }

        /* File Upload Area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--accent-bg);
        }

        .upload-area p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        #fileInput { display: none; }

        /* Paste Box */
        #pasteInput {
            width: 100%;
            height: 80px;
            padding: 8px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            resize: vertical;
            outline: none;
            margin-bottom: 8px;
            background: var(--card-bg);
            color: var(--text-dark);
        }

        .btn-action {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 9px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-action:hover {
            background: var(--primary-hover);
        }

        /* Navigation List */
        .nav-section h3 {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .module-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .module-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 8px;
            border-radius: 4px;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .module-list a:hover {
            background: var(--accent-bg);
            color: var(--primary);
        }

        .badge-count {
            background: var(--accent-bg);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 12px;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 44px clamp(28px, 5vw, 72px);
            max-width: 1440px;
        }

        /* Top Banner Stats */
        .top-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            padding: 0 0 20px;
            margin-bottom: 28px;
        }

        .stat-group {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-item .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .stat-item .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.04em;
        }

        .page-description {
            margin-top: 6px;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        /* Module Card & Tables */
        .module-card {
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            padding: 0 0 28px;
            margin-bottom: 36px;
        }

        .module-card h2 {
            font-size: 1rem;
            color: var(--text-dark);
            margin-bottom: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .study-list {
            list-style: none;
            counter-reset: study-item;
        }

        .study-list li {
            counter-increment: study-item;
            position: relative;
            padding: 14px 8px 14px 38px;
            border-bottom: 1px solid var(--border);
            line-height: 1.6;
        }

        .study-list li::before {
            content: counter(study-item, decimal-leading-zero);
            position: absolute;
            left: 8px;
            top: 16px;
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 500;
        }

        .study-question {
            display: block;
            font-weight: 500;
        }

        .study-answer {
            display: block;
            margin-top: 4px;
            padding-left: 12px;
            border-left: 1px solid var(--border);
            color: #555b63;
        }

        .study-list li:nth-child(even) { background: transparent; }

        mark {
            background: var(--highlight-blue);
            color: #0b3266;
            font-weight: 600;
            padding: 1px 3px;
            border-radius: 2px;
        }

        mark.highlight-tone-1 { background: var(--highlight-green); color: #256400; }
        mark.highlight-tone-2 { background: var(--highlight-purple); color: #503f91; }

        ::selection { background: #d6e9ff; color: #17191d; }

        .model-status {
            min-height: 1rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .model-progress {
            display: block;
            width: 100%;
            height: 2px;
            margin-top: 6px;
            border: 0;
            border-radius: 2px;
            overflow: hidden;
            background: var(--border);
            accent-color: #1c77ff;
        }

        .model-progress::-webkit-progress-bar { background: var(--border); }
        .model-progress::-webkit-progress-value { background: #1c77ff; }
        .model-progress::-moz-progress-bar { background: #1c77ff; }

        .app-loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            background: var(--bg-main);
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        .app-loader[aria-hidden="true"] {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .app-loader-content {
            display: grid;
            justify-items: center;
            gap: 12px;
            padding: 24px;
            text-align: center;
        }

        .app-loader-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: #1c77ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .app-loader-title {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .app-loader-detail {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .btn-action[aria-busy="true"] { cursor: progress; }
        .btn-action[aria-busy="true"]::before {
            display: inline-block;
            width: 0.8em;
            height: 0.8em;
            margin-right: 0.65em;
            border: 1px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            content: "";
            vertical-align: -0.08em;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        @media (prefers-reduced-motion: no-preference) {
            .module-card { animation: arrive 0.28s ease-out both; }
            @keyframes arrive {
                from { opacity: 0; transform: translateY(5px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }

        @media (max-width: 760px) {
            body { display: block; }
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }
            .main-content {
                width: 100%;
                margin-left: 0;
                padding: 20px 16px;
            }
            .top-banner {
                align-items: flex-start;
                gap: 16px;
                padding: 16px;
            }
            .stat-group { gap: 16px; }
            .module-card { padding: 18px 14px; }
            .main-content { padding: 28px 18px; }
        }
    </style>
</head>
<body>
    <div class="app-loader" id="appLoader" role="status" aria-live="polite" aria-hidden="false">
        <div class="app-loader-content">
            <span class="app-loader-spinner" aria-hidden="true"></span>
            <p class="app-loader-title">Opening study notes</p>
            <p class="app-loader-detail" id="appLoaderDetail">Preparing the embedded app...</p>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Drivers Ed</h2>
        </div>

        <!-- Search Input -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search cards..." oninput="filterSearch()">
        </div>

        <!-- Quizlet Direct Links -->
        <div class="quick-links">
            <h3>Quizlet links</h3>
            <div class="link-grid">
                <a href="https://quizlet.com/126461449/print" target="_blank" rel="noopener noreferrer" class="quizlet-btn">Module 2 ↗</a>
                <a href="https://quizlet.com/126731738/print" target="_blank" rel="noopener noreferrer" class="quizlet-btn">Module 3 ↗</a>
                <a href="https://quizlet.com/126732227/print" target="_blank" rel="noopener noreferrer" class="quizlet-btn">Module 4 ↗</a>
                <a href="https://quizlet.com/126981466/print" target="_blank" rel="noopener noreferrer" class="quizlet-btn">Module 5 ↗</a>
            </div>
        </div>

        <!-- Tabbed Input Panel -->
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('paste', this)">Paste Text</button>
                <button class="tab-btn" onclick="switchTab('upload', this)">Upload .TXT</button>
            </div>

            <!-- Paste Tab -->
            <div id="tabPaste" class="tab-content">
                <textarea id="pasteInput" placeholder="Copy text from Quizlet and paste it here..."></textarea>
                <button class="btn-action" onclick="handlePaste()">Add study set</button>
                <p class="model-status" id="modelStatus" role="status" aria-live="polite"></p>
                <progress class="model-progress hidden" max="100" value="0" aria-label="Local AI loading progress"></progress>
            </div>

            <!-- Upload Tab -->
            <div id="tabUpload" class="tab-content hidden">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <strong>+ Choose .TXT File</strong>
                    <p>Click or drag file here</p>
                    <input type="file" id="fileInput" accept=".txt" multiple onchange="handleFileUpload(event)">
                </div>
                <p class="model-status" id="uploadStatus" role="status" aria-live="polite"></p>
                <progress class="model-progress hidden" max="100" value="0" aria-label="Local AI loading progress"></progress>
            </div>
        </div>

        <!-- Loaded Modules Navigation -->
        <nav class="nav-section">
            <h3>Modules</h3>
            <ul class="module-list" id="moduleNav"></ul>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Dashboard Top Banner -->
        <div class="top-banner">
            <div>
                <h1 class="page-title">Study notes</h1>
                <p class="page-description">Search across your study modules</p>
            </div>
            <div class="stat-group">
                <div class="stat-item">
                    <span class="value" id="statModules">0</span>
                    <span class="label">Modules</span>
                </div>
                <div class="stat-item">
                    <span class="value" id="statQuestions">0</span>
                    <span class="label">Questions</span>
                </div>
            </div>
        </div>

        <!-- Modules Container -->
        <div id="modulesContainer"></div>
    </main>

    <script id="embeddedModelArchive" type="application/octet-stream">__SMOLLM_MODEL_ARCHIVE_BASE64__</script>

        let appDomReady = false;
        let embeddedArchiveReady = false;

        function checkEmbeddedArchiveReady() {
            const archiveText = document.getElementById('embeddedModelArchive')?.firstChild;
            embeddedArchiveReady = Boolean(archiveText && archiveText.length > 1000);
        }

        function hideStartupLoaderIfReady() {
            if (!appDomReady || !embeddedArchiveReady) return;
            const loader = document.getElementById('appLoader');
            loader.setAttribute('aria-hidden', 'true');
        }

        document.addEventListener('embeddedmodelready', () => {
            checkEmbeddedArchiveReady();
            hideStartupLoaderIfReady();
        });

        window.addEventListener('DOMContentLoaded', () => {
            moduleStore.push(module2Data);
            renderAllModules();
            checkEmbeddedArchiveReady();
            appDomReady = true;
            hideStartupLoaderIfReady();
        });

        // Tab Switching
        function switchTab(tab, button) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tabPaste').classList.add('hidden');
            document.getElementById('tabUpload').classList.add('hidden');

            if (tab === 'paste') {
                document.getElementById('tabPaste').classList.remove('hidden');
            } else {
                document.getElementById('tabUpload').classList.remove('hidden');
            }
            button.classList.add('active');
        }

        const PARSER_MODEL = 'HuggingFaceTB/SmolLM2-135M-Instruct';
        const PARSER_REVISION = '12fd25f77366fa6b3b4b768ec3050bf629380bac';

        let parserPipelinePromise;
        let embeddedModelAssetsPromise;

        function setModelStatus(message) {
            document.querySelectorAll('.model-status').forEach(status => {
                status.textContent = message;
                const progress = status.nextElementSibling;
                if (!(progress instanceof HTMLProgressElement)) return;
                const fraction = message.match(/(\d+)\s+of\s+(\d+)/i);
                const percent = message.match(/(\d+(?:\.\d+)?)%/);
                const indeterminate = /\b(?:loading|starting|interpreting|unpacking|checking)\b/i.test(message);
                if (fraction) {
                    progress.value = Number(fraction[1]) / Number(fraction[2]) * 100;
                    progress.classList.remove('hidden');
                } else if (percent) {
                    progress.value = Number(percent[1]);
                    progress.classList.remove('hidden');
                } else if (indeterminate) {
                    progress.removeAttribute('value');
                    progress.classList.remove('hidden');
                } else {
                    progress.value = 0;
                    progress.classList.add('hidden');
                }
            });
            const loaderDetail = document.getElementById('appLoaderDetail');
            const loader = document.getElementById('appLoader');
            if (loaderDetail && loader?.getAttribute('aria-hidden') === 'false') {
                loaderDetail.textContent = message;
            }
        }

        async function getEmbeddedModelAssets() {
            if (!embeddedModelAssetsPromise) {
                embeddedModelAssetsPromise = (async () => {
                    const archiveElement = document.getElementById('embeddedModelArchive');
                    const encodedArchive = archiveElement?.textContent.trim();
                    if (!encodedArchive || encodedArchive.startsWith('__SMOLLM_')) {
                        throw new Error('The local AI archive is missing. Rebuild index.svg with the embedded model bundle.');
                    }
                    archiveElement.textContent = '';

                    const archive = decodeBase64Chunks(encodedArchive);
                    const assets = await unzipEmbeddedModel(archive);
                    const requiredFiles = [
                        'config.json',
                        'generation_config.json',
                        'merges.txt',
                        'onnx/model_quantized.onnx',
                        'special_tokens_map.json',
                        'tokenizer.json',
                        'tokenizer_config.json',
                        'vocab.json'
                    ];
                    const missingFiles = requiredFiles.filter(file => !assets.has(file));
                    if (missingFiles.length) {
                        throw new Error(`The embedded local AI archive is missing: ${missingFiles.join(', ')}.`);
                    }
                    return assets;
                })().catch(error => {
                    embeddedModelAssetsPromise = null;
                    throw error;
                });
            }
            return embeddedModelAssetsPromise;
        }

        function decodeBase64Chunks(encoded) {
            const padding = encoded.endsWith('==') ? 2 : encoded.endsWith('=') ? 1 : 0;
            const bytes = new Uint8Array(Math.floor(encoded.length * 3 / 4) - padding);
            const chunkSize = 64 * 1024;
            let offset = 0;
            for (let index = 0; index < encoded.length; index += chunkSize) {
                const binary = atob(encoded.slice(index, index + chunkSize));
                for (let byteIndex = 0; byteIndex < binary.length; byteIndex++) {
                    bytes[offset + byteIndex] = binary.charCodeAt(byteIndex);
                }
                offset += binary.length;
            }
            if (offset !== bytes.length) throw new Error('The embedded local AI archive is incomplete.');
            return bytes;
        }

        async function unzipEmbeddedModel(archive) {
            const view = new DataView(archive.buffer, archive.byteOffset, archive.byteLength);
            const endSignature = 0x06054b50;
            const centralSignature = 0x02014b50;
            const localSignature = 0x04034b50;
            let endOffset = -1;
            for (let offset = archive.length - 22; offset >= Math.max(0, archive.length - 65557); offset--) {
                if (view.getUint32(offset, true) === endSignature) {
                    endOffset = offset;
                    break;
                }
            }
            if (endOffset < 0) throw new Error('The embedded local AI archive is not a valid ZIP file.');

            const entryCount = view.getUint16(endOffset + 10, true);
            let entryOffset = view.getUint32(endOffset + 16, true);
            const decoder = new TextDecoder();
            const assets = new Map();
            const modelRoot = `${PARSER_MODEL}/`;

            for (let index = 0; index < entryCount; index++) {
                if (view.getUint32(entryOffset, true) !== centralSignature) {
                    throw new Error('The embedded local AI ZIP directory is damaged.');
                }
                const compression = view.getUint16(entryOffset + 10, true);
                const compressedSize = view.getUint32(entryOffset + 20, true);
                const uncompressedSize = view.getUint32(entryOffset + 24, true);
                const filenameLength = view.getUint16(entryOffset + 28, true);
                const extraLength = view.getUint16(entryOffset + 30, true);
                const commentLength = view.getUint16(entryOffset + 32, true);
                const localOffset = view.getUint32(entryOffset + 42, true);
                const filename = decoder.decode(archive.subarray(entryOffset + 46, entryOffset + 46 + filenameLength));
                entryOffset += 46 + filenameLength + extraLength + commentLength;
                if (!filename.startsWith(modelRoot)) continue;

                if (view.getUint32(localOffset, true) !== localSignature) {
                    throw new Error(`The embedded local AI ZIP entry is damaged: ${filename}.`);
                }
                const localNameLength = view.getUint16(localOffset + 26, true);
                const localExtraLength = view.getUint16(localOffset + 28, true);
                const dataOffset = localOffset + 30 + localNameLength + localExtraLength;
                const compressed = archive.subarray(dataOffset, dataOffset + compressedSize);
                let contents;
                if (compression === 0) {
                    contents = compressed.slice();
                } else if (compression === 8 && typeof DecompressionStream === 'function') {
                    const stream = new Blob([compressed]).stream()
                        .pipeThrough(new DecompressionStream('deflate-raw'));
                    contents = new Uint8Array(await new Response(stream).arrayBuffer());
                } else {
                    throw new Error(`This browser cannot unpack the embedded local AI file: ${filename}.`);
                }
                if (contents.length !== uncompressedSize) {
                    throw new Error(`The embedded local AI file is incomplete: ${filename}.`);
                }
                assets.set(filename.slice(modelRoot.length), contents);
                setModelStatus(`Unpacking embedded local AI ${index + 1} of ${entryCount}...`);
            }
            archive.fill(0);
            return assets;
        }

        function createEmbeddedModelCache(assets) {
            function getModelPath(key) {
                const value = typeof key === 'string' ? key : key?.url;
                if (!value) return '';
                const marker = `/${PARSER_MODEL}/resolve/${PARSER_REVISION}/`;
                const markerIndex = value.indexOf(marker);
                return markerIndex === -1 ? '' : value.slice(markerIndex + marker.length).split('?')[0];
            }

            return {
                async match(...keys) {
                    for (const key of keys) {
                        const contents = assets.get(getModelPath(key));
                        if (contents) return new Response(contents);
                    }
                    return undefined;
                },
                async put(key, response) {
                    const path = getModelPath(key);
                    if (!path) throw new Error('Transformers.js requested a model file outside the embedded bundle.');
                    assets.set(path, new Uint8Array(await response.arrayBuffer()));
                }
            };
        }

        async function getParserPipeline() {
            if (!parserPipelinePromise) {
                parserPipelinePromise = (async () => {
                    const modelAssets = await getEmbeddedModelAssets();
                    let transformers;
                    try {
                        transformers = await import(TRANSFORMERS_URL);
                    } catch (error) {
                        throw new Error(`Could not load Transformers.js from jsDelivr (${error.message}). Check the network or allow cdn.jsdelivr.net.`);
                    }

                    const { env, pipeline } = transformers;
                    env.useBrowserCache = false;
                    env.useFSCache = false;
                    env.useCustomCache = true;
                    env.customCache = createEmbeddedModelCache(modelAssets);
                    env.allowRemoteModels = false;
                    env.allowLocalModels = true;
                    env.remoteHost = 'https://embedded-model.invalid/';
                    env.backends.onnx.wasm.wasmPaths = ONNX_WASM_URL;
                    env.backends.onnx.wasm.numThreads = self.crossOriginIsolated
                        ? Math.max(1, Math.min(4, navigator.hardwareConcurrency || 1))
                        : 1;

                    const progress_callback = progress => {
                        const detail = progress.file || progress.status || 'Preparing model';
                        const percent = Number.isFinite(progress.progress) ? ` ${Math.round(progress.progress)}%` : '';
                        setModelStatus(`Loading local AI ${detail}${percent}`);
                    };
                    setModelStatus('Starting embedded local AI on CPU...');
                    try {
                        return await pipeline('text-generation', PARSER_MODEL, {
                            revision: PARSER_REVISION,
                            device: 'wasm',
                            dtype: 'q8',
                            progress_callback
                        });
                    } catch (error) {
                        throw new Error(`Embedded local AI could not initialize: ${error.message}`);
                    }
                })().catch(error => {
                    parserPipelinePromise = null;
                    throw error;
                });
            }
            return parserPipelinePromise;
        }

        function getQuizletEntries(rawText, fallbackName) {
            const cleanText = rawText.replace(/\d+\s*\/\s*\d+/g, '')
                .replace(/Study online at https:\/\/quizlet\.com\/\S+/g, '')
                .trim();
            const itemRegex = /(?:^|\n)\s*(\d+)\.\s*/g;
            const matches = [...cleanText.matchAll(itemRegex)];
            const heading = cleanText.slice(0, matches[0]?.index ?? cleanText.length)
                .trim().split(/\n+/).filter(Boolean).pop() || fallbackName;
            const titleMatch = heading.match(/(?:Drivers Ed )?Module \d+/i);
            const title = titleMatch ? titleMatch[0].trim() : heading;
            const entries = matches.map((match, index) => {
                const start = match.index + match[0].length;
                const end = index + 1 < matches.length ? matches[index + 1].index : cleanText.length;
                return {
                    num: Number(match[1]),
                    raw: cleanText.slice(start, end).trim()
                };
            }).filter(entry => entry.raw);

            if (!entries.length) {
                throw new Error('No numbered Quizlet cards were found. Include entries such as "1. Term".');
            }
            return { title, entries };
        }

        function splitAnswerHighlights(answer) {
            return [...new Set(answer
                .split(/\s*(?:\/|;|\n|•)\s*/)
                .map(point => point.trim())
                .filter(Boolean))];
        }

        function getHighlightPhrases(answer, suggestions) {
            const suggestedPhrases = Array.isArray(suggestions)
                ? suggestions.filter(phrase => typeof phrase === 'string' && phraseOccursInAnswer(answer, phrase))
                : [];
            const answerPoints = splitAnswerHighlights(answer);
            const hasMultiplePoints = answerPoints.length > 1;
            const phrases = suggestedPhrases.length ? suggestedPhrases : answerPoints;
            return [...new Set([...phrases, ...(hasMultiplePoints ? answerPoints : [])])];
        }

        function parseCardLocally(entry) {
            const tabSeparated = entry.raw.split(/\t+/).map(line => line.trim()).filter(Boolean);
            if (tabSeparated.length >= 2) {
                const question = tabSeparated.shift().replace(/^(?:question|prompt|term)\s*:\s*/i, '');
                const answer = tabSeparated.join(' ').replace(/^(?:answer|definition|response)\s*:\s*/i, '');
                if (question && answer) {
                    return { num: entry.num, question, answer, highlights: splitAnswerHighlights(answer) };
                }
            }

            const lines = entry.raw.split(/\n+/).map(line => line.trim()).filter(Boolean);
            const labeledQuestion = lines.findIndex(line => /^(?:question|prompt|term)\s*:/i.test(line));
            const labeledAnswer = lines.findIndex(line => /^(?:answer|definition|response)\s*:/i.test(line));
            if (labeledQuestion !== -1 && labeledAnswer !== -1) {
                const question = lines[labeledQuestion].replace(/^(?:question|prompt|term)\s*:/i, '').trim();
                const answer = lines[labeledAnswer].replace(/^(?:answer|definition|response)\s*:/i, '').trim();
                if (question && answer) {
                    return { num: entry.num, question, answer, highlights: splitAnswerHighlights(answer) };
                }
            }

            const inlineLabeled = entry.raw.match(/^(?:question|prompt|term)\s*:\s*(.+?)\s+(?:answer|definition|response)\s*:\s*([\s\S]+)$/i);
            if (inlineLabeled) {
                const question = inlineLabeled[1].trim();
                const answer = inlineLabeled[2].trim();
                return { num: entry.num, question, answer, highlights: splitAnswerHighlights(answer) };
            }

            const inlineQuestion = entry.raw.match(/^(.+?\?)\s+(.+)$/);
            if (inlineQuestion) {
                const question = inlineQuestion[1].trim();
                const answer = inlineQuestion[2].trim();
                return { num: entry.num, question, answer, highlights: splitAnswerHighlights(answer) };
            }

            const boolIndex = lines.findIndex(line => /^(true|false)[.!]?$/i.test(line));
            if (boolIndex !== -1) {
                const answer = lines[boolIndex].replace(/[.!]$/, '').toLowerCase();
                const question = lines.filter((_, index) => index !== boolIndex).join(' ').trim();
                if (question) {
                    return { num: entry.num, question, answer, highlights: [answer] };
                }
            }

            const blankIndex = lines.findIndex(line => /_{2,}|…{2,}|\.{3,}/.test(line));
            if (blankIndex !== -1) {
                const question = lines[blankIndex];
                const answer = lines.filter((_, index) => index !== blankIndex).join(' ').trim();
                if (answer) {
                    return { num: entry.num, question, answer, highlights: splitAnswerHighlights(answer) };
                }
            }

            if (lines.length < 2) return null;

            const questionIndex = lines.findIndex(line =>
                /\?$/.test(line) || /^(?:what|which|who|where|when|why|how|define|identify|name|list|explain)\b/i.test(line)
            );
            const selectedQuestion = questionIndex === -1 ? 0 : questionIndex;
            const question = lines[selectedQuestion];
            const answer = lines.filter((_, index) => index !== selectedQuestion).join(' ').trim();
            if (question && answer) {
                return { num: entry.num, question, answer, highlights: splitAnswerHighlights(answer) };
            }
            return null;
        }

        function preserveCard(entry) {
            return {
                num: entry.num,
                question: entry.raw.split(/\n+/).map(line => line.trim()).filter(Boolean).join(' '),
                answer: '',
                highlights: []
            };
        }

        function normalizedSourceText(text) {
            return text.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/\s+/g, ' ');
        }

        function phraseOccursInAnswer(answer, phrase) {
            const normalizedAnswer = normalizedSourceText(answer);
            const normalizedPhrase = normalizedSourceText(phrase);
            return normalizedPhrase && (` ${normalizedAnswer} `).includes(` ${normalizedPhrase} `);
        }

        function extractModelCard(content) {
            const text = String(content || '').replace(/```(?:json)?|```/gi, '');
            const start = text.indexOf('{');
            if (start === -1) return null;
            let depth = 0;
            let inString = false;
            let escaped = false;
            for (let index = start; index < text.length; index++) {
                const character = text[index];
                if (inString) {
                    if (escaped) escaped = false;
                    else if (character === '\\') escaped = true;
                    else if (character === '"') inString = false;
                    continue;
                }
                if (character === '"') inString = true;
                else if (character === '{') depth++;
                else if (character === '}' && --depth === 0) {
                    try {
                        return JSON.parse(text.slice(start, index + 1));
                    } catch {
                        return null;
                    }
                }
            }
            return null;
        }

        function validModelCardSplit(entry, item) {
            if (!item) return null;
            const question = typeof item.question === 'string' ? item.question.trim() : '';
            const answer = typeof item.answer === 'string' ? item.answer.trim() : '';
            if (!question || !answer) return null;

            const source = normalizedSourceText(entry.raw);
            const normalizedQuestion = normalizedSourceText(question);
            const normalizedAnswer = normalizedSourceText(answer);
            const questionStart = source.indexOf(normalizedQuestion);
            const answerStart = source.indexOf(normalizedAnswer);
            const separate = questionStart >= 0 && answerStart >= 0 &&
                (questionStart + normalizedQuestion.length <= answerStart ||
                    answerStart + normalizedAnswer.length <= questionStart);
            if (!separate) return null;
            return {
                num: entry.num,
                question,
                answer,
                highlights: getHighlightPhrases(answer, item.highlights)
            };
        }

        async function parseWithModel(entries) {
            const parser = await getParserPipeline();
            const items = [];
            for (let index = 0; index < entries.length; index++) {
                const entry = entries[index];
                setModelStatus(`Interpreting card ${index + 1} of ${entries.length}...`);
                const messages = [
                    {
                        role: 'system',
                        content: 'Split one flashcard into its question and answer. Copy exact text only. Do not answer from memory. Return one JSON object with question, answer, and highlights.'
                    },
                    {
                        role: 'user',
                        content: 'Question: When should tire pressure be checked? Answer: Weekly.'
                    },
                    {
                        role: 'assistant',
                        content: '{"question":"When should tire pressure be checked?","answer":"Weekly.","highlights":["Weekly."]}'
                    },
                    {
                        role: 'user',
                        content: `Copy the question and answer exactly from this one card. For true/false, use the claim and its true/false answer. For a blank, keep the blank in the question and copy its answer.\n${entry.raw}\nReturn only the JSON object.`
                    }
                ];
                const output = await parser(messages, {
                    max_new_tokens: Math.min(160, Math.max(96, Math.ceil(64 + entry.raw.length / 4))),
                    do_sample: false,
                });
                const generated = output[0]?.generated_text;
                const content = typeof generated === 'string'
                    ? generated
                    : Array.isArray(generated)
                        ? generated.at(-1)?.content || ''
                        : '';
                const parsedItem = extractModelCard(content);
                items.push(validModelCardSplit(entry, parsedItem) || preserveCard(entry));
            }
            return items;
        }

        async function parseQuizletText(rawText, fallbackName) {
            const { title, entries } = getQuizletEntries(rawText, fallbackName);
            const resolved = new Map();
            const unresolved = [];
            let modelError = '';
            entries.forEach(entry => {
                const item = parseCardLocally(entry);
                if (item) resolved.set(entry.num, item);
                else unresolved.push(entry);
            });

            if (unresolved.length) {
                setModelStatus(`Paired ${resolved.size} cards locally; using on-device AI for ${unresolved.length} complex cards...`);
                try {
                    const modelItems = await parseWithModel(unresolved);
                    modelItems.forEach(item => resolved.set(item.num, item));
                } catch (error) {
                    modelError = error instanceof Error ? error.message : String(error);
                    unresolved.forEach(entry => resolved.set(entry.num, preserveCard(entry)));
                }
            }
            if (modelError) {
                setModelStatus(`AI could not interpret some cards (${modelError}); all source cards were kept together.`);
            } else {
                const aiFallbackCount = [...resolved.values()].filter(item => !item.answer).length;
                setModelStatus(aiFallbackCount
                    ? `Kept all ${entries.length} cards together; ${aiFallbackCount} could not be separated safely and remain in their original wording.`
                    : `Paired all ${entries.length} question-and-answer cards without splitting them.`);
            }
            return { title, items: entries.map(entry => resolved.get(entry.num)) };
        }

        async function handlePaste() {
            const input = document.getElementById('pasteInput');
            if (!input.value.trim()) return;
            const button = document.querySelector('#tabPaste .btn-action');
            setButtonBusy(button, true, 'Preparing cards...');
            try {
                const fallback = `Module ${moduleStore.length + 1}`;
                const parsed = await parseQuizletText(input.value, fallback);
                saveModule(parsed);
                input.value = '';
            } catch (error) {
                setModelStatus(error.message || 'Could not parse this Quizlet text.');
            } finally {
                setButtonBusy(button, false);
            }
        }

        function setButtonBusy(button, isBusy, busyLabel = '') {
            if (isBusy) {
                button.dataset.idleLabel ||= button.textContent;
                button.disabled = true;
                button.setAttribute('aria-busy', 'true');
                button.textContent = busyLabel;
            } else {
                button.disabled = false;
                button.removeAttribute('aria-busy');
                if (button.dataset.idleLabel) {
                    button.textContent = button.dataset.idleLabel;
                    delete button.dataset.idleLabel;
                }
            }
        }

        async function handleFileUpload(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;
            try {
                for (const file of files) {
                    setModelStatus(`Reading ${file.name}...`);
                    const text = await file.text();
                    const parsed = await parseQuizletText(text, file.name.replace(/\.txt$/i, ''));
                    saveModule(parsed);
                }
            } catch (error) {
                setModelStatus(error.message || 'Could not parse the selected file.');
            } finally {
                event.target.value = '';
            }
        }

        function saveModule(parsedData) {
            const existingIdx = moduleStore.findIndex(m => m.title.toLowerCase() === parsedData.title.toLowerCase());
            if (existingIdx !== -1) {
                moduleStore[existingIdx] = parsedData;
            } else {
                moduleStore.push(parsedData);
            }
            renderAllModules();
        }

        // Render UI Elements
        function renderAllModules() {
            const container = document.getElementById('modulesContainer');
            const nav = document.getElementById('moduleNav');

            container.innerHTML = '';
            nav.innerHTML = '';

            let totalQuestions = 0;

            moduleStore.forEach((mod, index) => {
                const modId = 'module-' + index;
                totalQuestions += mod.items.length;

                // Nav list element
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${modId}"><span>${escapeHtml(mod.title)}</span><span class="badge-count">${mod.items.length}</span></a>`;
                nav.appendChild(li);

                // Card Element
                const card = document.createElement('div');
                card.className = 'module-card';
                card.id = modId;

                const studyItems = mod.items.map(item => {
                    const question = item.question || item.q || item.sentence || '';
                    const answer = item.answer || item.a || '';
                    const searchableText = `${question} ${answer}`.toLowerCase();
                    const questionHtml = escapeHtml(question);
                    const highlights = item.highlights?.length
                        ? item.highlights
                        : item.highlight || splitAnswerHighlights(answer);
                    const answerHtml = answer
                        ? `<span class="study-answer">${highlightImportantText(answer, highlights)}</span>`
                        : '';
                    return `<li data-search="${escapeHtml(searchableText)}"><span class="study-question">${questionHtml}</span>${answerHtml}</li>`;
                }).join('');

                card.innerHTML = `
                    <h2>${escapeHtml(mod.title)}</h2>
                    <ol class="study-list">${studyItems}</ol>
                `;
                container.appendChild(card);
            });

            // Update stats
            document.getElementById('statModules').innerText = moduleStore.length;
            document.getElementById('statQuestions').innerText = totalQuestions;

            filterSearch();
        }

        // Filter Logic
        function filterSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.module-card');

            cards.forEach(card => {
                const rows = card.querySelectorAll('.study-list li');
                let matchesInCard = false;

                rows.forEach(row => {
                    const text = row.dataset.search;
                    if (text.includes(query)) {
                        row.classList.remove('hidden');
                        matchesInCard = true;
                    } else {
                        row.classList.add('hidden');
                    }
                });

                if (matchesInCard) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function highlightImportantText(text, highlights) {
            const phrases = (Array.isArray(highlights) ? highlights : [highlights])
                .filter(phrase => typeof phrase === 'string' && phrase.trim())
                .map(phrase => phrase.trim())
                .sort((left, right) => right.length - left.length);
            if (!phrases.length) return escapeHtml(text);

            const markedPhrases = new Set(phrases.map(phrase => phrase.toLowerCase()));
            const pattern = new RegExp(`(${phrases.map(phrase => phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
            let highlightIndex = 0;
            return text.split(pattern).map(part => {
                if (!markedPhrases.has(part.toLowerCase())) return escapeHtml(part);
                const tone = highlightIndex++ % 3;
                return `<mark class="highlight-tone-${tone}">${escapeHtml(part)}</mark>`;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
